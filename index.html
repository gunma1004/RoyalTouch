<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈케어라운지 | 24시간 프리미엄 방문 힐링 테라피 플랫폼</title>
  <style>
    /* 기존 스타일 그대로 유지 */
    #homecare-page { width: 100% !important; background: #f7f3ea !important; padding-bottom: 50px; font-family: -apple-system, sans-serif !important; }
    .hcl-container { width: 100% !important; max-width: 1180px !important; margin: 0 auto !important; padding: 0 20px !important; }
    .hcl-main-banner-img { width: 100% !important; max-height: 380px !important; object-fit: cover !important; border-radius: 20px !important; display: block !important; margin-bottom: 30px; }
    .hcl-shop-card { background: #fff !important; border-radius: 24px !important; padding: 24px !important; display: flex !important; align-items: center !important; gap: 24px !important; margin-bottom: 20px !important; border: 1px solid rgba(0,0,0,0.1) !important; }
    .hcl-shop-img { width: 170px !important; height: 170px !important; min-width: 170px !important; border-radius: 16px !important; object-fit: cover !important; }
    
    .hcl-tabs { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-wrap: wrap; }
    .hcl-tab { padding: 10px 20px; cursor: pointer; border: 1px solid #ddd; border-radius: 20px; background: #fff; font-weight: bold; text-decoration: none; color: #333; }
    .hcl-tab.active { background: #1f486d; color: #fff; border-color: #1f486d; }
    .hcl-links-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

<div id="homecare-page">
  <section class="hcl-container" style="padding-top: 40px;">
    <img src="/images/banner.jpg" alt="홈케어라운지 메인 배너" class="hcl-main-banner-img">
  </section>

  <!-- 지역 선택 탭 -->
  <section class="hcl-container">
    <div class="hcl-tabs">
      <button class="hcl-tab active" onclick="switchRegion('seoul', this)">서울특별시</button>
      <button class="hcl-tab" onclick="switchRegion('gyeonggi', this)">경기도</button>
      <button class="hcl-tab" onclick="switchRegion('incheon', this)">인천광역시</button>
      <button class="hcl-tab" onclick="switchRegion('cheonan', this)">천안시</button>
    </div>
    <div id="subregion-container" class="hcl-links-grid"></div>
  </section>

  <section class="hcl-container">
    <h2 style="text-align:center; margin:40px 0 20px;">수도권 대표 제휴 업체</h2>
    <div id="shop-list-container"></div>
  </section>
</div>

<script>
  // 1. 지역 데이터
  const regionData = {
    seoul: [
      {n:"강남구", k:"seoul-gangnam"}, {n:"도봉구", k:"seoul-dobong"}, {n:"동작구", k:"seoul-dongjak"}
      /* 나머지 서울 지역 추가 가능 */
    ],
    gyeonggi: [
      {n:"안산시", k:"gyeonggi-ansan"}, {n:"수원시", k:"gyeonggi-suwon"}
    ],
    incheon: [{n:"부평구", k:"incheon-bupyeong"}],
    cheonan: [{n:"천안시", k:"cheonan"}]
  };

  // 2. 지역 전환 함수
  function switchRegion(reg, el) {
    document.querySelectorAll('.hcl-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('subregion-container').innerHTML = regionData[reg].map(item => 
      `<a href="/${item.k}/" style="padding:10px 16px; background:#fff; border:1px solid #1f486d; border-radius:8px; color:#1f486d; font-size:14px; font-weight:600; text-decoration:none;">${item.n} ➔</a>`
    ).join('');
  }

  // 3. 업체 리스트 데이터
  const shopsData = [
    { name: "한국미인홈케어", phone: "0507-1280-3288", badge: "추천업체", desc: "24시 정성 가득한 타이 & 아로마 전문 케어", img: "/images/shop1.jpg" },
    { name: "젊은애인홈타이", phone: "0507-1280-3183", badge: "인기폭발", desc: "지친 일상에 편안한 휴식을 선사하는 테라피", img: "/images/shop2.jpg" },
    { name: "그녀의온도홈타이", phone: "0507-1280-3245", badge: "24시상시", desc: "빠른 방문과 철저한 위생 관리를 약속드립니다", img: "/images/shop3.jpg" },
    { name: "젊은미녀홈타이", phone: "0507-1280-3180", badge: "신규제휴", desc: "베테랑 관리사의 맞춤형 피로 회복 케어", img: "/images/shop4.jpg" },
    { name: "지금될까홈타이", phone: "0507-1280-3228", badge: "만족도1위", desc: "후불제 안심 이용, 25분 내 빠른 도착", img: "/images/shop5.jpg" }
  ];

  window.onload = function() {
    const shopContainer = document.getElementById('shop-list-container');
    shopsData.forEach(shop => {
      shopContainer.innerHTML += `
        <div class="hcl-shop-card">
          <img src="${shop.img}" class="hcl-shop-img">
          <div class="hcl-shop-info">
            <span style="background:#d8a85f; color:#fff; padding:2px 8px; border-radius:4px; font-size:12px;">${shop.badge}</span>
            <h3 style="margin:8px 0;">${shop.name}</h3>
            <p style="font-size:14px; color:#666;">${shop.desc}</p>
            <div style="font-weight:bold; color:#1f486d; font-size:16px;">📞 ${shop.phone}</div>
            <a href="tel:${shop.phone}" style="display:inline-block; margin-top:5px; color:#1f486d; font-weight:bold;">전화 연결</a>
          </div>
        </div>`;
    });
    // 초기 실행
    switchRegion('seoul', document.querySelector('.hcl-tab'));
  };
</script>
</body>
</html>
