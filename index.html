<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>홈케어라운지 | 24시간 프리미엄 방문 힐링 테라피 플랫폼</title>
  
  <style>
    /* ✅ CSS 선택자에 # 추가 (매우 중요) */
    #homecare-page, #homecare-page * { box-sizing: border-box !important; font-family: -apple-system, sans-serif !important; }
    #homecare-page { width: 100% !important; background: #f7f3ea !important; }
    
    .hcl-container { width: 100% !important; max-width: 1180px !important; margin: 0 auto !important; padding: 0 20px !important; }
    .hcl-main-banner-img { width: 100% !important; max-height: 380px !important; object-fit: cover !important; border-radius: 20px !important; }
    .hcl-shop-card { background: #fff !important; border-radius: 24px !important; padding: 24px !important; display: flex !important; align-items: center !important; gap: 24px !important; margin-bottom: 20px !important; border: 1px solid rgba(0,0,0,0.1) !important; }
    .hcl-shop-img { width: 170px !important; height: 170px !important; border-radius: 16px !important; object-fit: cover !important; }
    /* 기타 스타일은 기존 유지 */
  </style>
</head>
<body>

<div id="homecare-page">
  <!-- 배너 영역 -->
  <section class="hcl-banner-section">
    <div class="hcl-container">
      <img src="/images/banner.jpg" alt="홈케어라운지 메인 배너" class="hcl-main-banner-img">
    </div>
  </section>

  <!-- 업체 리스트 -->
  <section class="hcl-shop-section">
    <div class="hcl-container">
      <div class="hcl-shop-list" id="shop-list-container"></div>
    </div>
  </section>

  <!-- 지역 선택 -->
  <section class="hcl-region-box">
    <div class="hcl-container">
       <div class="hcl-tabs" id="region-tabs"></div>
       <div id="subregion-container"></div>
    </div>
  </section>
</div>

<script>
  const shopsData = [
    { name: "프리미엄 힐링케어", phone: "0507-1280-3288", badge: "추천업체", desc: "24시 정성 가득한 전문 테라피", img: "/images/shop1.jpg", courses: [{ name: "스페셜 릴랙스", price: "90,000원" }] }
  ];

  function renderSubRegionCards(regKey) {
     const subContainer = document.getElementById('subregion-container');
     if(subContainer) subContainer.innerHTML = "지역별 상세 링크가 여기에 표시됩니다.";
  }

  window.onload = function() {
    // 1. 업체 리스트 렌더링
    const shopContainer = document.getElementById('shop-list-container');
    shopsData.forEach(shop => {
      shopContainer.innerHTML += `
        <div class="hcl-shop-card">
          <img src="${shop.img}" alt="${shop.name}" class="hcl-shop-img">
          <div>
            <h3>${shop.name}</h3>
            <p>${shop.desc}</p>
          </div>
        </div>`;
    });
    
    // 2. 지역 선택 함수 호출
    renderSubRegionCards('seoul');
  };
</script>
</body>
</html>
