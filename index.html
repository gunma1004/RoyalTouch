<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈케어라운지 | 24시간 프리미엄 방문 힐링 테라피 플랫폼</title>
  <style>
    #homecare-page { width: 100% !important; background: #f7f3ea !important; padding-bottom: 50px; }
    .hcl-container { width: 100% !important; max-width: 1180px !important; margin: 0 auto !important; padding: 0 20px !important; }
    .hcl-main-banner-img { width: 100% !important; max-height: 380px !important; object-fit: cover !important; border-radius: 20px !important; display: block !important; margin-bottom: 30px; }
    .hcl-shop-card { background: #fff !important; border-radius: 24px !important; padding: 24px !important; display: flex !important; align-items: center !important; gap: 24px !important; margin-bottom: 20px !important; border: 1px solid rgba(0,0,0,0.1) !important; }
    .hcl-shop-img { width: 170px !important; height: 170px !important; min-width: 170px !important; border-radius: 16px !important; object-fit: cover !important; }
    
    /* 지역 탭 스타일 */
    .hcl-tabs { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-wrap: wrap; }
    .hcl-tab { padding: 10px 20px; cursor: pointer; border: 1px solid #ddd; border-radius: 20px; background: #fff; font-weight: bold; }
    .hcl-tab.active { background: #1f486d; color: #fff; border-color: #1f486d; }
    .hcl-links-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  </style>
</head>
<body>

<div id="homecare-page">
  <section class="hcl-container" style="padding-top: 30px;">
    <img src="/images/banner.jpg" alt="홈케어라운지 메인 배너" class="hcl-main-banner-img">
  </section>

  <!-- 지역 선택 탭 -->
  <section class="hcl-container">
    <div class="hcl-tabs">
      <button class="hcl-tab active" onclick="switchRegion('seoul', this)">서울특별시</button>
      <button class="hcl-tab" onclick="switchRegion('gyeonggi', this)">경기도</button>
      <button class="hcl-tab" onclick="switchRegion('incheon', this)">인천광역시</button>
      <button class="hcl-tab" onclick="switchRegion('cheonan', this)">천안시</button>
    </div>
    <div id="subregion-container" class="hcl-links-grid"></div>
  </section>

  <!-- 업체 리스트 -->
  <section class="hcl-container">
    <h2 style="text-align:center; margin:40px 0 20px;">수도권 대표 제휴 업체</h2>
    <div id="shop-list-container"></div>
  </section>
</div>

<script>
  // 🌟 폴더 구조에 있는 모든 지역을 빠짐없이 등록한 데이터
  const regionData = {
    seoul: [
      {n:"도봉구", k:"seoul-dobong"}, {n:"동대문구", k:"seoul-dongdaemun"}, {n:"동작구", k:"seoul-dongjak"},
      {n:"은평구", k:"seoul-eunpyeong"}, {n:"강북구", k:"seoul-gangbuk"}, {n:"강동구", k:"seoul-gangdong"},
      {n:"강남구", k:"seoul-gangnam"}, {n:"강서구", k:"seoul-gangseo"}, {n:"금천구", k:"seoul-geumcheon"},
      {n:"구로구", k:"seoul-guro"}, {n:"관악구", k:"seoul-gwanak"}, {n:"광진구", k:"seoul-gwangjin"},
      {n:"종로구", k:"seoul-jongno"}, {n:"중구", k:"seoul-junggu"}, {n:"중랑구", k:"seoul-jungnang"},
      {n:"마포구", k:"seoul-mapo"}, {n:"노원구", k:"seoul-nowon"}, {n:"서초구", k:"seoul-seocho"}
      // 필요시 남은 서울 구들도 여기에 추가 가능합니다
    ],
    gyeonggi: [
      {n:"안산시", k:"gyeonggi-ansan"}, {n:"부천시", k:"gyeonggi-bucheon"}, {n:"김포시", k:"gyeonggi-gimpo"},
      {n:"고양시(일산)", k:"gyeonggi-goyang"}, {n:"화성시(동탄)", k:"gyeonggi-hwaseong"}, {n:"평택시", k:"gyeonggi-pyeongtaek"},
      {n:"성남시(분당)", k:"gyeonggi-seongnam"}, {n:"시흥시", k:"gyeonggi-siheung"}, {n:"수원시", k:"gyeonggi-suwon"},
      {n:"용인시", k:"gyeonggi-yongin"}
    ],
    incheon: [
      {n:"부평구", k:"incheon-bupyeong"}, {n:"동구", k:"incheon-donggu"}, {n:"계양구", k:"incheon-gyeyang"},
      {n:"중구", k:"incheon-junggu"}, {n:"미추홀구", k:"incheon-michuhol"}, {n:"남동구", k:"incheon-namdong"},
      {n:"서구", k:"incheon-seogu"}, {n:"연수구(송도)", k:"incheon-yeonsu"}
    ],
    cheonan: [
      {n:"천안시 전체", k:"cheonan"} // 필요에 따라 조정
    ]
  };

  // 지역 탭 변경 함수
  function switchRegion(reg, el) {
    document.querySelectorAll('.hcl-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    
    const container = document.getElementById('subregion-container');
    container.innerHTML = regionData[reg].map(item => 
      `<a href="/${item.k}/" style="padding:10px 16px; background:#fff; border:1px solid #1f486d; border-radius:8px; color:#1f486d; font-size:14px; font-weight:600;">${item.n} 방문케어 ➔</a>`
    ).join('');
  }

  // 5개 제휴 업체 리스트 렌더링
  const shopsData = [
    { name: "한국미인홈케어", phone: "0507-1280-3288", badge: "추천업체", desc: "24시 정성 가득한 타이 & 아로마 전문 케어", img: "/images/shop1.jpg", courses: [{ name: "스페셜 릴랙스 (60분)", price: "90,000원" }] },
    { name: "젊은애인홈타이", phone: "0507-1280-3183", badge: "인기폭발", desc: "지친 일상에 편안한 휴식을 선사하는 테라피", img: "/images/shop2.jpg", courses: [{ name: "바디 케어 (60분)", price: "60,000원" }] },
    { name: "그녀의온도홈타이", phone: "0507-1280-3245", badge: "24시상시", desc: "빠른 방문과 철저한 위생 관리를 약속드립니다", img: "/images/shop3.jpg", courses: [{ name: "타이/아로마 (60분)", price: "60,000원" }] },
    { name: "젊은미녀홈타이", phone: "0507-1280-3180", badge: "신규제휴", desc: "베테랑 관리사의 맞춤형 피로 회복 케어", img: "/images/shop4.jpg", courses: [{ name: "타이코스 (60분)", price: "60,000원" }] },
    { name: "지금될까홈타이", phone: "0507-1280-3228", badge: "만족도1위", sb: "후불제 안심 이용, 25분 내 빠른 도착", img: "/images/shop5.jpg", courses: [{ name: "스웨디시 코스 (60분)", price: "140,000원" }] }
  ];

  window.onload = function() {
    const shopContainer = document.getElementById('shop-list-container');
    shopsData.forEach(shop => {
      let coursesHtml = shop.courses.map(c => 
        `<div style="display:flex; justify-content:space-between; font-size:14px; margin-top:5px;">
           <span>${c.name}</span><strong>${c.price}</strong>
         </div>`
      ).join('');
      
      shopContainer.innerHTML += `
        <div class="hcl-shop-card">
          <img src="${shop.img}" alt="${shop.name}" class="hcl-shop-img">
          <div class="hcl-shop-info">
            <span style="background:#d8a85f; padding:2px 8px; border-radius:4px; font-size:12px; color:#fff;">${shop.badge}</span>
            <h3 style="margin:8px 0;">${shop.name}</h3>
            <p style="color:#666; font-size:14px;">${shop.desc}</p>
            ${coursesHtml}
          </div>
        </div>`;
    });
    
    // 처음에 페이지가 열리면 서울 지역 버튼이 눌려있도록 설정
    switchRegion('seoul', document.querySelector('.hcl-tab'));
  };
</script>
</body>
</html>
