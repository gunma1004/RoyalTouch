<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈케어라운지 | 24시간 프리미엄 방문 힐링 테라피 플랫폼</title>
  <style>
    /* 1. 레이아웃 고정 */
    #homecare-page { width: 100% !important; background: #f7f3ea !important; padding-bottom: 50px; }
    .hcl-container { width: 100% !important; max-width: 1180px !important; margin: 0 auto !important; padding: 0 20px !important; }
    
    /* 2. 배너 스타일 */
    .hcl-banner-section { padding: 40px 0 20px !important; }
    .hcl-main-banner-img { width: 100% !important; max-height: 380px !important; object-fit: cover !important; border-radius: 20px !important; display: block !important; }
    
    /* 3. 업체 카드 스타일 */
    .hcl-shop-card { background: #fff !important; border-radius: 24px !important; padding: 24px !important; display: flex !important; align-items: center !important; gap: 24px !important; margin-bottom: 20px !important; border: 1px solid rgba(0,0,0,0.1) !important; }
    .hcl-shop-img { width: 170px !important; height: 170px !important; min-width: 170px !important; border-radius: 16px !important; object-fit: cover !important; }
    .hcl-shop-info { flex: 1 !important; }
  </style>
</head>
<body>

<div id="homecare-page">
  <!-- 배너를 가장 위로 올림 -->
  <section class="hcl-banner-section">
    <div class="hcl-container">
      <img src="/images/banner.jpg" alt="홈케어라운지 메인 배너" class="hcl-main-banner-img">
    </div>
  </section>

  <!-- 업체 리스트 -->
  <section class="hcl-shop-section">
    <div class="hcl-container">
      <h2 style="text-align:center; margin-bottom:30px;">수도권 대표 제휴 업체</h2>
      <div class="hcl-shop-list" id="shop-list-container"></div>
    </div>
  </section>
</div>

<script>
  // 5개 업체 데이터를 모두 복원했습니다
  const shopsData = [
    { name: "한국미인홈케어", phone: "0507-1280-3288", badge: "추천업체", desc: "24시 정성 가득한 타이 & 아로마 전문 케어", img: "/images/shop1.jpg", courses: [{ name: "스페셜 릴랙스 (60분)", price: "90,000원" }] },
    { name: "젊은애인홈타이", phone: "0507-1280-3183", badge: "인기폭발", desc: "지친 일상에 편안한 휴식을 선사하는 테라피", img: "/images/shop2.jpg", courses: [{ name: "바디 케어 (60분)", price: "60,000원" }] },
    { name: "그녀의온도홈타이", phone: "0507-1280-3245", badge: "24시상시", desc: "빠른 방문과 철저한 위생 관리를 약속드립니다", img: "/images/shop3.jpg", courses: [{ name: "타이/아로마 (60분)", price: "60,000원" }] },
    { name: "젊은미녀홈타이", phone: "0507-1280-3180", badge: "신규제휴", desc: "베테랑 관리사의 맞춤형 피로 회복 케어", img: "/images/shop4.jpg", courses: [{ name: "타이코스 (60분)", price: "60,000원" }] },
    { name: "지금될까홈타이", phone: "0507-1280-3228", badge: "만족도1위", desc: "후불제 안심 이용, 25분 내 빠른 도착", img: "/images/shop5.jpg", courses: [{ name: "스웨디시 코스 (60분)", price: "140,000원" }] }
  ];

  window.onload = function() {
    const shopContainer = document.getElementById('shop-list-container');
    if (shopContainer) {
      shopsData.forEach(shop => {
        let coursesHtml = shop.courses.map(c => 
          `<div style="display:flex; justify-content:space-between; font-size:14px; margin-top:5px;">
             <span>${c.name}</span><strong>${c.price}</strong>
           </div>`
        ).join('');
        
        shopContainer.innerHTML += `
          <div class="hcl-shop-card">
            <img src="${shop.img}" alt="${shop.name}" class="hcl-shop-img">
            <div class="hcl-shop-info">
              <span style="background:#d8a85f; padding:2px 8px; border-radius:4px; font-size:12px;">${shop.badge}</span>
              <h3 style="margin:8px 0;">${shop.name}</h3>
              <p style="color:#666; font-size:14px;">${shop.desc}</p>
              ${coursesHtml}
            </div>
          </div>`;
      });
    }
  };
</script>
</body>
</html>
